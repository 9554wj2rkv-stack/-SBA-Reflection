/* =========================================================
   LAYOUT
   ========================================================= */
main{display:block;min-height:100vh;padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + 1.25rem)}
.screen{max-width:var(--col);margin:0 auto;padding:0 calc(var(--safe-r) + 18px) 1rem calc(var(--safe-l) + 18px)}
.fade-in{animation:fadeIn .4s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Header (interior screens) */
.hdr{position:sticky;top:0;z-index:25;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;
  padding:calc(var(--safe-t) + 6px) calc(var(--safe-r) + 12px) 6px calc(var(--safe-l) + 12px);
  background:linear-gradient(180deg,rgba(4,13,28,.92) 60%,rgba(4,13,28,0));max-width:none}
.hdr-title{text-align:center;font-family:var(--serif);font-weight:500;font-size:.92rem;letter-spacing:.26em;text-transform:uppercase;color:var(--text);
  padding-left:.26em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title.long{letter-spacing:.16em;padding-left:.16em}
.hdr-btn{width:46px;height:46px;border:0;background:transparent;display:grid;place-items:center;color:var(--text);border-radius:50%;padding:0}
.hdr-btn svg{width:26px;height:26px}
.star-btn{width:46px;height:46px;border:0;background:transparent;display:grid;place-items:center;padding:0;justify-self:end}
.star-btn span{width:36px;height:36px;border-radius:50%;border:1px solid var(--gold-line);display:grid;place-items:center;color:var(--gold);
  box-shadow:0 0 14px rgba(231,185,110,.18) inset}
.star-btn svg{width:18px;height:18px}

/* Ornament divider */
.ornament{display:flex;align-items:center;justify-content:center;gap:.55rem;color:var(--gold);margin:0 auto}
.ornament::before,.ornament::after{content:"";height:1px;width:72px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament::after{background:linear-gradient(90deg,var(--gold),transparent)}
.ornament svg{width:16px;height:16px}

/* Glass card */
.glass{background:var(--glass);border:1px solid var(--gold-soft);border-radius:20px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.glass.strong{border-color:var(--gold-line)}

/* Circled gold icon */
.ci{width:52px;height:52px;flex:none;border-radius:50%;border:1px solid var(--gold-line);display:grid;place-items:center;color:var(--gold);
  background:radial-gradient(circle,rgba(231,185,110,.08),transparent 70%)}
.ci svg{width:26px;height:26px}
.ci.sm{width:44px;height:44px}
.ci.sm svg{width:22px;height:22px}

/* Buttons */
.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:54px;padding:.75rem 1.6rem;border-radius:999px;border:0;
  background:linear-gradient(180deg,#F7D9A3,#E4B067);color:#1d1407;font-family:var(--sans);font-weight:500;font-size:1.02rem;letter-spacing:.02em;
  box-shadow:0 8px 28px rgba(231,185,110,.28);text-decoration:none}
.btn-gold svg{width:20px;height:20px}
.btn-gold:active,.btn-line:active{transform:scale(.98)}
.btn-gold.block,.btn-line.block{display:flex;width:100%}
.btn-line{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:52px;padding:.7rem 1.4rem;border-radius:999px;
  border:1px solid var(--gold-line);background:rgba(8,20,40,.55);color:var(--text);font-weight:500;font-size:1rem;text-decoration:none}
.btn-line.danger{border-color:rgba(255,173,153,.6);color:var(--danger)}
.btn-round{width:54px;height:54px;border-radius:50%;border:1px solid var(--gold-line);background:rgba(8,20,40,.55);display:grid;place-items:center;color:var(--text);flex:none;padding:0}
.btn-round svg{width:22px;height:22px}
.btn-round[disabled]{opacity:.35}
.chev{width:20px;height:20px;color:var(--gold);flex:none}
.text-link{background:none;border:0;color:var(--gold-2);font-weight:500;text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:.4rem .2rem}

/* Type helpers */
.label{font-family:var(--sans);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--text-2);font-weight:400}
.muted{color:var(--text-2)}
.small{font-size:.88rem}
.tiny{font-size:.78rem;color:var(--muted)}
.serif-lead{font-family:var(--serif);font-size:1.3rem;line-height:1.35;color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
  padding:.24rem .6rem;border-radius:999px;border:1px solid var(--gold-line);color:var(--gold-2);background:rgba(231,185,110,.10)}
.badge.demo{border-color:rgba(155,134,214,.7);color:#E0D6FA;background:rgba(155,134,214,.16)}
.badge.ok{border-color:rgba(168,230,190,.55);color:var(--ok);background:rgba(168,230,190,.08)}
.badge.warn{border-color:rgba(255,173,153,.6);color:var(--danger);background:rgba(255,173,153,.08)}
.notice{border:1px solid rgba(155,134,214,.45);background:rgba(155,134,214,.12);padding:.8rem 1rem;border-radius:14px;font-size:.88rem;color:var(--text)}
.notice.warn{border-color:rgba(255,173,153,.5);background:rgba(255,173,153,.08)}
.banner{margin:.5rem 0 1rem;padding:.85rem 1rem;border-radius:14px;background:rgba(255,173,153,.12);border:1px solid rgba(255,173,153,.5);font-size:.9rem}

/* Moon photo */
.moon-img{display:block;border-radius:50%;object-fit:cover;aspect-ratio:1/1;height:auto;flex:none;align-self:center;max-width:none}
.moon-img.glow{box-shadow:0 0 34px rgba(246,214,160,.32),0 0 90px rgba(246,214,160,.12)}
.moon-img.new{filter:brightness(.26) saturate(.4) sepia(.2) hue-rotate(180deg);box-shadow:0 0 0 1px rgba(170,190,220,.25),0 0 22px rgba(120,150,200,.18)}

/* =========================================================
   1. HOME
   ========================================================= */
.home-hero{position:relative;width:100%;max-width:var(--col);margin:0 auto;aspect-ratio:853/720;min-height:calc(330px + var(--safe-t));
  background:var(--hero-img) center top / cover no-repeat;overflow:hidden}
.home-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,rgba(4,13,28,0),var(--bg))}
.home-top{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;
  padding:calc(var(--safe-t) + 6px) calc(var(--safe-r) + 10px) 0 calc(var(--safe-l) + 10px);z-index:2}
.brand{text-align:center;line-height:1.25;min-width:0;overflow:hidden}
.brand .b1{font-family:var(--serif);font-weight:500;font-size:clamp(.7rem,3.05vw,.92rem);letter-spacing:.22em;color:var(--text);padding-left:.22em;white-space:nowrap}
.brand .b2{font-family:var(--sans);font-size:clamp(.5rem,2.1vw,.6rem);letter-spacing:.42em;color:var(--gold);padding-left:.42em;margin-top:.15rem;white-space:nowrap}
.hero-title{position:absolute;left:0;right:0;top:47%;z-index:2;text-align:center;font-family:var(--sc);font-weight:500;color:#FBF8F2;
  font-size:clamp(2.5rem,13.4vw,4rem);line-height:.88;letter-spacing:.01em;text-shadow:0 2px 18px rgba(30,10,0,.35)}
.hero-title span{display:block}
.hero-sub{position:absolute;left:0;right:0;top:78.5%;z-index:2;text-align:center;font-family:var(--sans);font-weight:300;
  font-size:clamp(.66rem,2.95vw,.9rem);letter-spacing:.32em;line-height:1.55;color:#F2EEE8;padding-left:.34em}
.home-hero .ornament{position:absolute;left:0;right:0;top:93%;z-index:2}
.home-body{position:relative;z-index:3;max-width:var(--col);margin:-6px auto 0;padding:0 calc(var(--safe-r) + 18px) 0 calc(var(--safe-l) + 18px)}
.home-body .bg-stars{position:absolute;inset:0;z-index:-1;background:var(--hero-img) center top / 220% auto no-repeat;opacity:.14;filter:blur(1px)}

.event-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(.6rem,4vw,1.1rem);width:100%;text-align:left;
  padding:.75rem .8rem .75rem 1rem;margin:0 auto 12px;border-radius:28px;color:var(--text);
  background:linear-gradient(160deg,rgba(30,52,92,.62),rgba(8,18,38,.78));border:1px solid var(--gold-line);
  box-shadow:0 0 0 1px rgba(231,185,110,.08) inset,0 14px 40px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.event-card .moon-img{width:clamp(56px,17vw,76px)}
.event-card .ev-kind{font-family:var(--serif);font-size:clamp(1.45rem,7.4vw,1.9rem);line-height:1.05;margin:.1rem 0 .2rem}
.event-card .ev-date{font-size:clamp(.6rem,2.85vw,.76rem);letter-spacing:.2em;text-transform:uppercase;color:var(--text)}
.event-card .ev-time{font-size:clamp(.6rem,2.7vw,.74rem);letter-spacing:.16em;color:var(--text-2);text-transform:uppercase}
.event-card .ev-arrow{display:flex;align-items:center;align-self:stretch;padding-left:.9rem;border-left:1px solid var(--gold-line);color:var(--gold)}
.event-card .ev-arrow svg{width:22px;height:22px}

.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.2rem;min-height:clamp(100px,28vw,136px);padding:.75rem .5rem .7rem;
  border-radius:20px;border:1px solid var(--gold-line);color:var(--text);overflow:hidden;

.nav-card:nth-child(2){background-position:center,right top,center}
.nav-card:nth-child(3){background-position:center,left bottom,center}
.nav-card:nth-child(4){background-position:center,right bottom,center}
.nav-card .ci{width:clamp(40px,11.5vw,52px);height:clamp(40px,11.5vw,52px)}
.nav-card .ci svg{width:66%;height:66%}
.nav-card strong{font-family:var(--sans);font-weight:400;font-size:clamp(.6rem,2.95vw,.82rem);letter-spacing:.14em;white-space:nowrap;text-transform:uppercase;margin-top:.45rem;padding-left:.18em;line-height:1.25}
.nav-card .nc-sub{font-size:clamp(.64rem,3vw,.84rem);color:var(--text-2);line-height:1.3;padding:0 1.25rem}
.nav-card .nc-chev{position:absolute;right:9px;top:62%;color:var(--gold);width:20px;height:20px}
.soon-tag{position:absolute;top:0;right:0;background:linear-gradient(180deg,#F4D59C,#E4B067);color:#1d1407;font-size:.54rem;font-weight:600;letter-spacing:.12em;
  padding:.22rem .6rem;border-radius:0 19px 0 12px}
.quote-card{position:relative;margin:14px 0 .4rem;padding:1rem 1rem 1.25rem;text-align:center;border-radius:22px;border:1px solid var(--gold-soft);background:rgba(6,15,32,.55)}
.quote-card::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:1px;background:linear-gradient(90deg,transparent,var(--gold-2),transparent)}
.quote-card p{font-family:var(--serif);font-style:italic;font-size:clamp(.95rem,4.2vw,1.2rem);line-height:1.45;color:var(--text)}
.quote-card .ornament{position:absolute;left:0;right:0;bottom:-9px}
.quote-card .ornament svg{background:var(--bg);border-radius:50%}

/* =========================================================
   2. THIS MOON — overview
   ========================================================= */
.moon-stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding:.6rem 0 0}
.moon-stage .moon-img{width:min(46vw,190px);margin:.4rem 0 1.2rem}
.moon-stage h1{font-size:2.6rem;line-height:1}
.moon-stage .sub-serif{font-family:var(--serif);font-size:1.8rem;margin-top:.15rem}
.moon-stage .date{font-size:.9rem;letter-spacing:.12em;color:var(--text-2);margin-top:.45rem}
.theme{font-family:var(--serif);font-size:1.38rem;line-height:1.35;text-align:center;margin:1.1rem .4rem .8rem}
.intro{font-size:.95rem;color:var(--text-2);text-align:center;margin:0 .2rem 1.2rem}
.g-row{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;min-height:66px;padding:.55rem 1rem .55rem .6rem;margin-bottom:10px;color:var(--text);border-radius:18px}
.g-row .g-label{flex:1;font-family:var(--serif);font-size:1.25rem}
.g-row .chev{width:20px;height:20px;color:var(--gold);flex:none}
.continue-note{text-align:center;margin-top:.6rem}

/* =========================================================
   3. GUIDANCE DETAILS
   ========================================================= */
.gd-head{display:flex;align-items:center;gap:.9rem;margin:.6rem 0 1.2rem}
.gd-head h1{font-size:1.75rem}
.gd-list{list-style:none;margin:0 0 1.3rem;padding:0}
.gd-list li{position:relative;padding-left:1.3rem;margin:0 0 1.05rem;color:var(--text-2);font-size:1rem}
.gd-list li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(231,185,110,.6)}
.gd-list strong{color:var(--text);font-weight:500}
.lesson{display:flex;gap:.9rem;align-items:flex-start;padding:1rem;margin-bottom:1rem}
.lesson .lesson-kind{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:.25rem}
.lesson p.l-text{color:var(--text);font-size:1rem}
.lesson p.l-text.statement{font-family:var(--serif);font-style:italic;font-size:1.25rem;line-height:1.4}
.gd-nav{display:flex;gap:10px;margin:1rem 0}
.gd-nav .btn-line{flex:1;font-size:.92rem;padding:.6rem .8rem}
.spacer-art{height:min(36vw,170px)}

/* =========================================================
   4. REFLECTION
   ========================================================= */
body.mode-reflect main{padding-bottom:0}
.reflect-shell{position:fixed;left:0;right:0;top:var(--vv-top);height:calc(var(--vv-h) - var(--reflect-gap,0px));display:flex;flex-direction:column;z-index:20}
body.mode-reflect:not(.kb-open){--reflect-gap:calc(var(--tabbar-h) + var(--safe-b))}
body.mode-reflect.kb-open .tabbar{display:none}
.reflect-shell .hdr{position:relative;background:transparent}
.reflect-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;max-width:var(--col);margin:0 auto;
  padding:.2rem calc(var(--safe-r) + 18px) .6rem calc(var(--safe-l) + 18px);display:flex;flex-direction:column}
.r-moon{display:flex;align-items:center;gap:1rem;padding:.2rem 0 1rem;border-bottom:1px solid var(--gold-soft);margin-bottom:.9rem}
.r-moon .moon-img{width:62px}
.r-moon .rm-kind{font-family:var(--serif);font-size:1.45rem;line-height:1.1}
.r-moon .rm-date{font-size:.86rem;color:var(--text-2)}
.r-progress{height:3px;border-radius:2px;background:rgba(210,216,226,.18);overflow:hidden}
.r-progress i{display:block;height:100%;background:linear-gradient(90deg,#F4D59C,#E4B067);transition:width .3s ease}
.r-count{display:flex;justify-content:space-between;align-items:center;margin:.45rem 0 .6rem}
.r-count .n{font-size:.82rem;color:var(--text-2);letter-spacing:.08em}
.dots{display:flex;gap:2px}
.dot{width:30px;height:30px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;border:1px solid var(--gold-line)}
.dot.answered::before{background:rgba(231,185,110,.55)}
.dot.current::before{background:var(--gold-2);border-color:var(--gold-2);box-shadow:0 0 8px rgba(244,213,156,.6)}
.q-text{font-family:var(--serif);font-size:2rem;line-height:1.18;margin:.2rem 0 1rem;transition:opacity .22s ease}
.answer-wrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:9.5rem;border-radius:18px;border:1px solid var(--gold-soft);
  background:rgba(6,16,34,.62);transition:border-color .2s,opacity .22s}
.answer-wrap:focus-within{border-color:var(--gold-line);box-shadow:0 0 0 3px rgba(231,185,110,.12)}
.answer{flex:1;width:100%;min-height:7.5rem;resize:none;border:0;background:transparent;color:var(--text);padding:1rem 1rem .4rem;
  font-family:var(--sans);font-size:1.06rem;line-height:1.6}
.answer:focus{outline:none}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.answer::placeholder{color:#97A3B6}
.answer-foot{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:0 1rem .6rem;font-size:.78rem;color:var(--muted)}
.save-status{display:flex;align-items:center;gap:.3rem;min-height:1.4rem}
.save-status svg{width:15px;height:15px}
.save-status.saved{color:var(--ok)}
.save-status.error{color:var(--danger);font-weight:500}
.swap-out{opacity:0}
.hint{display:flex;gap:.85rem;align-items:center;padding:.85rem 1rem;margin-top:.9rem}
.hint p{font-size:.88rem;color:var(--text-2);line-height:1.45}
.reflect-foot{display:flex;align-items:center;gap:14px;width:100%;max-width:var(--col);margin:0 auto;padding:.7rem calc(var(--safe-r) + 18px) .8rem calc(var(--safe-l) + 18px)}
.reflect-foot .btn-gold{flex:1;max-width:220px;margin-left:auto}
body.kb-open .hint{display:none}

/* =========================================================
   5. COMPLETE
   ========================================================= */
.complete{text-align:center;padding-top:.6rem}
.crescent{width:150px;height:130px;margin:0 auto .6rem;display:block}
.complete h1{font-size:2rem;line-height:1.2;margin-bottom:.7rem}
.complete .thanks{color:var(--text-2);font-size:1rem;margin:0 auto 1.4rem;max-width:20rem}
.steps{text-align:left;padding:1rem 1.1rem .5rem;margin-bottom:1.3rem}
.steps h2{font-family:var(--serif);font-size:1.35rem;margin-bottom:.4rem}
.step{display:flex;align-items:center;gap:.9rem;width:100%;min-height:58px;padding:.55rem 0;border:0;border-top:1px solid rgba(231,185,110,.14);background:transparent;color:var(--text);text-align:left}
.step:first-of-type{border-top:0}
.step .s-ic{width:26px;height:26px;color:var(--gold);flex:none}
.step .s-tx{flex:1;font-size:.94rem;color:var(--text-2)}
.step .s-ck{width:22px;height:22px;color:var(--gold);flex:none}
.step .s-ck.todo{color:var(--muted)}

/* =========================================================
   6. JOURNAL
   ========================================================= */
.j-head{text-align:center;padding:.2rem 0 1rem}
.j-head svg{width:30px;height:30px;color:var(--gold)}
.j-head h1{font-family:var(--serif);font-size:1rem;letter-spacing:.32em;text-transform:uppercase;font-weight:500;margin-top:.3rem;padding-left:.32em}
.pills{display:flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--gold-soft);background:rgba(6,15,32,.6);margin-bottom:1.1rem}
.pill{flex:1;min-height:44px;border-radius:999px;border:0;background:transparent;color:var(--text-2);font-size:.92rem}
.pill[aria-selected="true"]{background:linear-gradient(180deg,#F7D9A3,#E4B067);color:#1d1407;font-weight:500}
.e-row{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;padding:.75rem 1rem .75rem .8rem;margin-bottom:10px;color:var(--text);border-radius:18px}
.e-row .moon-img{width:58px}
.e-row .e-main{flex:1;min-width:0}
.e-row .e-title{font-family:var(--sans);font-size:1rem;font-weight:500}
.e-row .e-date{font-size:.86rem;color:var(--text-2)}
.e-row .e-state{font-size:.74rem;color:var(--gold-2);letter-spacing:.06em;margin-top:.1rem}
.e-row .chev{width:20px;height:20px;color:var(--gold);flex:none}
.empty{text-align:center;padding:1.6rem .6rem}
.empty .moon-img{width:84px;margin:0 auto 1rem}
.qa{padding:1rem 0;border-top:1px solid rgba(231,185,110,.16)}
.qa:first-child{border-top:0;padding-top:.2rem}
.qa h3{font-family:var(--serif);font-size:1.3rem;margin-bottom:.45rem}
.qa .ans{white-space:pre-wrap;word-break:break-word}
.qa .ans.blank{color:var(--muted);font-style:italic}

/* =========================================================

details.d-row summary{list-style:none;display:flex;align-items:center;gap:.9rem;min-height:62px;padding:.5rem 1rem .5rem .6rem;cursor:pointer}
details.d-row summary::-webkit-details-marker{display:none}
details.d-row summary .d-label{flex:1;font-size:1rem}
details.d-row summary .chev{width:20px;height:20px;color:var(--gold);transition:transform .2s}
details.d-row[open] summary .chev{transform:rotate(90deg)}
details.d-row .d-body{padding:0 1.1rem 1.1rem 4.3rem;color:var(--text-2);font-size:.93rem}
details.d-row .d-body p+p{margin-top:.6rem}
.world-row{position:relative;display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;padding:1rem;margin:1rem 0 .5rem;color:var(--text);border-radius:20px}
.world-row .w-title{font-family:var(--serif);font-size:1.3rem}
.world-row .w-sub{font-size:.86rem;color:var(--text-2)}

/* =========================================================
   8. MENU (full screen)
   ========================================================= */
.menu-screen{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;overflow-y:auto}
.menu-screen.open{display:flex;animation:fadeIn .25s ease both}
.menu-screen .scene-menu{position:fixed;inset:0;z-index:-1;pointer-events:none}
.menu-screen .scene-menu .sky,.menu-screen .scene-menu .mountains{bottom:0}
.menu-list{width:100%;max-width:var(--col);margin:0 auto;padding:.4rem calc(var(--safe-r) + 22px) calc(var(--safe-b) + 2rem) calc(var(--safe-l) + 22px)}
.m-item{display:flex;align-items:center;gap:1rem;width:100%;min-height:54px;border:0;background:transparent;color:var(--text);text-align:left;padding:.3rem .2rem;font-size:1.06rem;border-radius:12px}
.m-item svg{width:26px;height:26px;color:var(--text);flex:none}
.m-item[aria-current="page"] svg,.m-item[aria-current="page"]{color:var(--gold-2)}
.m-item.dim{color:#8792A6}
.m-item.dim svg{color:#8792A6}
.m-item .m-sub{display:block;font-size:.82rem;color:#8792A6;margin-top:.1rem}
.m-item .m-tail{margin-left:auto}
.m-sep{border:0;border-top:1px solid rgba(231,185,110,.22);margin:.9rem 0}

/* =========================================================
   Settings / text screens
   ========================================================= */
.page-title{font-size:2.1rem;text-align:center;margin:.3rem 0 .4rem}
.page-sub{text-align:center;color:var(--text-2);margin-bottom:1.2rem}
.card{padding:1.15rem;margin-bottom:12px}
.card h3{font-size:1.35rem;margin-bottom:.4rem}
.card p+p{margin-top:.55rem}
.stack>*+*{margin-top:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:6.4rem;min-height:46px;border-radius:12px;border:1px solid var(--gold-soft);background:rgba(6,15,32,.5);font-size:.92rem}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:rgba(231,185,110,.18);color:var(--gold-2)}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;min-height:50px}
.switch{position:relative;width:56px;height:32px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;border-radius:999px;background:#33435c;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+.track{background:var(--gold)}
.switch input:checked+.track::after{transform:translateX(24px)}
.switch input:focus-visible+.track{outline:2px solid var(--gold-2);outline-offset:3px}
.planned{display:flex;gap:.9rem;align-items:flex-start;padding:.85rem 0;border-top:1px solid rgba(231,185,110,.16)}
.planned:first-of-type{border-top:0}

.ev-place{font-family:var(--serif);font-style:italic;font-size:clamp(.82rem,3.7vw,1rem);color:var(--gold-2);margin-top:.15rem;line-height:1.3}
.ev-place.pending{color:var(--muted);font-size:clamp(.72rem,3.2vw,.86rem)}
.places{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:1.1rem 0 .2rem}
.place{display:flex;align-items:center;gap:.65rem;padding:.7rem .8rem;border-radius:16px;min-width:0}
.place-ic{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--gold-line);display:grid;place-items:center;color:var(--gold)}
.place-ic svg{width:18px;height:18px}
.place-txt{min-width:0}
.place-lab{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text-2)}
.place-val{font-family:var(--serif);font-size:1.3rem;line-height:1.15;color:var(--text);overflow-wrap:anywhere}
.place.pending .place-val{font-family:var(--sans);font-size:.78rem;color:var(--muted);line-height:1.3}
.sky-details{margin-top:1rem}
.sd-body{padding-left:1.1rem!important}
.sd-h{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:.9rem 0 .35rem!important}
.sd-row{display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0;border-bottom:1px solid rgba(231,185,110,.1);font-size:.88rem}
.sd-k{color:var(--text-2)}
.sd-v{color:var(--text);text-align:right}
.e-row .e-place{font-size:.8rem;color:var(--gold-2);font-style:italic;font-family:var(--serif)}
.r-moon .rm-place{font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--gold-2)}

/* =========================================================
   Tab bar
   ========================================================= */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);max-width:none;
  padding:8px calc(var(--safe-r) + 8px) calc(var(--safe-b) + 6px) calc(var(--safe-l) + 8px);
  background:linear-gradient(180deg,rgba(10,18,34,.96),rgba(3,8,18,.98));border-radius:26px 26px 0 0;
  border-top:1px solid rgba(231,185,110,.16);box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:58px;border:0;background:transparent;
  color:#E7EAF0;font-family:var(--sans);font-size:.64rem;letter-spacing:.16em;font-weight:400;border-radius:14px;padding:0;white-space:nowrap}
.tabbar svg{width:28px;height:28px}
.tabbar button[aria-current="page"]{color:var(--gold)}
@media (min-width:600px){.tabbar{left:50%;right:auto;width:var(--col);transform:translateX(-50%)}}

/* Modal / toast */
.modal-wrap{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:1rem;padding-bottom:calc(var(--safe-b) + 1rem);background:rgba(2,6,14,.74)}
@media (min-width:600px){.modal-wrap{align-items:center}}
.modal{width:100%;max-width:500px;max-height:86vh;overflow-y:auto;background:linear-gradient(170deg,#132c54,#08172d);border:1px solid var(--gold-line);border-radius:24px;padding:1.4rem 1.25rem 1.2rem;animation:fadeIn .25s ease both}
.modal h2{font-size:1.65rem;margin-bottom:.6rem}
.modal .m-body{color:var(--text-2)}
.modal .m-body p+p{margin-top:.7rem}
.modal .m-actions{display:flex;flex-direction:column;gap:10px;margin-top:1.3rem}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + var(--safe-b) + 14px);transform:translateX(-50%) translateY(20px);z-index:95;max-width:min(92vw,500px);
  background:#F6F1E9;color:#0b1a2e;padding:.75rem 1.1rem;border-radius:14px;font-weight:500;font-size:.94rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* Motion */
@media (prefers-reduced-motion: reduce){html:not([data-motion="full"]) *{animation:none!important;transition:none!important}}
html[data-motion="reduce"] *{animation:none!important;transition:none!important}
.tw{animation:twinkle 5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}

@media (max-width:359px){
  .nav-card strong{letter-spacing:.08em}
  .nav-card .nc-sub{padding:0 1rem}
  .tabbar button{font-size:.56rem;letter-spacing:.1em}
}
</style>
</head>

/* Safe DOM builder. User text is ALWAYS inserted as text nodes. `html` is only
   ever passed trusted, app-authored markup (icons). */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const SKY_INDEX = (() => {
  const idx = {};
  for (const row of SKY_DATA.split(';')) {
    const [k, mc, sc, mt, st, ml, sl, mb] = row.split('|');
    if (!k) continue;
    const id = (k[0] === 'f' ? 'full' : 'new') + '-moon-' + k.slice(1, 5) + '-' + k.slice(5, 7) + '-' + k.slice(7, 9);
    idx[id] = { mc, sc, mt, st, ml: +ml, sl: +sl, mb: +mb };
  }
  return idx;
})();
/* Returns the separate data fields for one event. Never guesses: anything
   not in the verified table is returned with verified:false. */
function skyPositions(eventId) {
  const r = SKY_INDEX[eventId];
  const body = (code, sign, lon, lat) => {
    const verified = !!(r && code && CONSTELLATION_NAMES[code]);
    return {
      verified,
      constellation: verified ? CONSTELLATION_NAMES[code] : null,      // SBA display (true sky)
      constellationCode: verified ? code : null,
      tropicalSign: verified && sign !== '' ? TROPICAL_SIGNS[+sign] : null, // comparison only
      eclipticLongitude: r && isFinite(lon) ? lon : null,
      eclipticLatitude: r && lat != null && isFinite(lat) ? lat : null
    };
  };
  return {
    system: SKY_SYSTEM,
    inTable: !!r,
    moon: body(r && r.mc, r && r.mt, r && r.ml, r && r.mb),
    sun: body(r && r.sc, r && r.st, r && r.sl, null)
  };

const PENDING_TEXT = 'Position pending verification';
const placeName = b => (b && b.verified ? b.constellation : null);
function placementLine(sky) {
  const m = placeName(sky.moon), s = placeName(sky.sun);
  if (!m && !s) return 'Moon & Sun · ' + PENDING_TEXT.toLowerCase();
  return (m ? `Moon in ${m}` : 'Moon position pending verification') + ' · ' + (s ? `Sun in ${s}` : 'Sun position pending verification');
}

const normItem = it => (typeof it === 'string' ? { title: '', text: it } : { title: String(it.title || ''), text: String(it.text || '') });
function buildLunarEvent(a) {
  const sba = SBA_INTERPRETATIONS[a.id];
  const sky = skyPositions(a.id);
  const composed = sba ? null : placementInterpretation(a.type, sky);
  const interp = sba || composed || DEMO_INTERPRETATIONS[a.type];
  return {
    id: a.id,
    dateTime: a.iso,
    date: a.date,
    type: a.type,
    astronomy: {
      method: 'Calculated on this device using the Meeus lunar-phase algorithm (Astronomical Algorithms, ch. 49)',
      accuracy: 'typically within 1–2 minutes',
      timeZone: TIME_ZONE,
      constellation: placeName(sky.moon)
    },
    sky,
    interpretationSystem: sba ? 'Soul Blueprint Astrology' : (composed ? 'Demonstration content based on the verified true-sky placements — awaiting SBA interpretations' : 'Demonstration content — awaiting final SBA interpretations'),
    isDemo: !sba,
    placementBased: !!(sba || composed),
    theme: interp.theme,
    intro: interp.intro,
    lookOut: interp.lookOut.map(normItem),
    letGo: interp.letGo.map(normItem),
    letIn: interp.letIn.map(normItem),
    lessons: Object.assign({}, interp.lessons || {}),
    release: interp.release,
    invitation: interp.invitation,
    questions: interp.questions.slice(0, 4)
  };
}

function getLunarContext(now = new Date()) {
  try {
    if (!CONFIG.ASTRONOMY_ENABLED) throw new Error('Astronomy calculations are switched off in configuration.');
    const evts = lunarEventsBetween(new Date(now.getTime() - 40 * 864e5), new Date(now.getTime() + 40 * 864e5));
    const past = evts.filter(e => e.date <= now), future = evts.filter(e => e.date > now);
    if (!past.length || !future.length) throw new Error('Could not determine surrounding lunar events.');
    const last = past[past.length - 1], next = future[0];
    const daysSinceLast = (now - last.date) / 864e5;
    const isCurrent = daysSinceLast <= CONFIG.CURRENT_EVENT_WINDOW_DAYS;
    const chosen = isCurrent ? last : next;
    if (!isFinite(chosen.date.getTime())) throw new Error('Invalid calculated date.');
    return { status: isCurrent ? 'current' : 'upcoming', event: buildLunarEvent(chosen), all: evts };
  } catch (err) {
    return { status: 'unavailable', reason: err.message || String(err) };
  }
}

/* Modal (returns a Promise with the chosen action value) */
function showModal({ title, body, actions }) {
  return new Promise(resolve => {
    const root = $('#modalRoot');
    const prevFocus = document.activeElement;
    const close = v => { wrap.remove(); document.removeEventListener('keydown', onKey); if (prevFocus && prevFocus.focus) prevFocus.focus({ preventScroll: true }); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    const bodyEl = h('div', { class: 'm-body' });
    if (body instanceof Node) bodyEl.append(body);
    else (Array.isArray(body) ? body : [body]).forEach(t => t && bodyEl.append(h('p', { text: t })));
    const acts = h('div', { class: 'm-actions' }, (actions || [{ label: 'Close', value: null }]).map(a =>
      h('button', { class: (a.style === 'primary' ? 'btn-gold' : 'btn-line' + (a.style === 'danger' ? ' danger' : '')) + ' block', onclick: () => close(a.value), text: a.label })));
    const modal = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'mTitle' },
      h('h2', { id: 'mTitle', text: title }), bodyEl, acts);
    const wrap = h('div', { class: 'modal-wrap', onclick: e => { if (e.target === wrap) close(null); } }, modal);
    root.append(wrap);
    document.addEventListener('keydown', onKey);
    setTimeout(() => { const f = acts.querySelector('button'); f && f.focus(); }, 30);
  });
}

/* ---------- 4. GUIDED REFLECTION ---------- */
let reflectState = null;
const wordCount = t => ((t || '').trim().match(/\S+/g) || []).length;
function renderReflect(view, args) {
  const entry = Journal.get(args[0]);
  if (!entry) {
    document.body.classList.remove('mode-reflect');
    view.append(header('Your Reflection', { back: 'journal' }), h('section', { class: 'screen' }, h('h1', { class: 'page-title', text: 'Reflection not found' }),

      h('button', { class: 'btn-gold block', onclick: () => go('journal'), text: 'Open my reflections' })));
    return;
  }
  let qi = Math.min(Math.max(parseInt(args[1], 10) || 0, 0), entry.questions.length - 1);
  autosave.entryId = entry.id;
  const total = entry.questions.length;

  const qText = h('h1', { class: 'q-text', id: 'qText', tabindex: '-1' });
  const bar = h('i');
  const countN = h('span', { class: 'n' });
  const dots = h('div', { class: 'dots', role: 'group', 'aria-label': 'Jump to question' });
  const ta = h('textarea', { class: 'answer', id: 'answer', 'aria-labelledby': 'qText', placeholder: 'Write your reflection…', autocomplete: 'off', autocapitalize: 'sentences', spellcheck: 'true' });
  const status = h('span', { class: 'save-status', id: 'saveStatus', 'aria-live': 'polite' });
  const words = h('span', { class: 'wc' });
  const wrap = h('div', { class: 'answer-wrap' }, ta, h('div', { class: 'answer-foot' }, status, words));
  const prevBtn = h('button', { class: 'btn-round', 'aria-label': 'Previous question', html: ICONS.arrowL, onclick: () => moveTo(qi - 1) });
  const nextBtn = h('button', { class: 'btn-gold', onclick: () => (qi < total - 1 ? moveTo(qi + 1) : finish()) });

  const shell = h('div', { class: 'reflect-shell' },
    header('Your Reflection', { back: saveAndClose, backLabel: 'Save and close' }),
    h('div', { class: 'reflect-body' },
      h('div', { class: 'r-moon' }, moonImg(entry.eventType),
        h('div', null, h('div', { class: 'rm-kind', text: typeLabel(entry.eventType) }), h('div', { class: 'rm-date', text: fmtDate(new Date(entry.eventDate)) }),
          h('div', { class: 'rm-place', text: placementLine(skyPositions(entry.eventId)) }))),
      h('div', { class: 'r-progress', role: 'presentation' }, bar),
      h('div', { class: 'r-count' }, countN, dots),
      qText,
      entry.interpretation && entry.interpretation.isDemo ? h('p', { class: 'tiny', style: 'margin:-.6rem 0 .6rem', text: 'Demonstration question' }) : null,
      wrap,
      h('div', { class: 'hint glass' }, ci('bulb', true), h('p', { text: 'Allow yourself to be honest. There are no right or wrong answers. This is your personal space.' }))),
    h('div', { class: 'reflect-foot' }, prevBtn, nextBtn));
  view.append(shell);

  function paint(animate) {
    const apply = () => {
      countN.textContent = `${qi + 1} / ${total}`;
      countN.setAttribute('aria-label', `Question ${qi + 1} of ${total}`);
      bar.style.width = ((qi + 1) / total * 100) + '%';
      qText.textContent = entry.questions[qi];
      ta.value = entry.answers[qi] || '';
      dots.innerHTML = '';
      entry.questions.forEach((_, i) => {
        const d = h('button', { class: 'dot' + (i === qi ? ' current' : '') + ((entry.answers[i] || '').trim() ? ' answered' : ''),
          'aria-label': `Question ${i + 1}${(entry.answers[i] || '').trim() ? ', answered' : ''}`, onclick: () => moveTo(i) });

      nextBtn.setAttribute('aria-label', qi === total - 1 ? 'Finish reflection' : ((ta.value || '').trim() ? 'Next question' : 'Skip to next question'));
      updateWords();

    else apply();
  }
  function updateWords() { const n = wordCount(ta.value); words.textContent = n === 1 ? '1 word' : n + ' words'; }
  function moveTo(i) {

    flushSave();
    qi = i;
    entry.currentQ = qi;
    autosave.dirty = true; flushSave();
    history.replaceState(null, '', `#reflect/${entry.id}/${qi}`);
    paint(true);
    shell.querySelector('.reflect-body').scrollTop = 0;
  }
  function finish() {

  }
  function saveAndClose() {

  ta.addEventListener('input', () => {
    entry.answers[qi] = ta.value;
    entry.updatedAt = new Date().toISOString();
    scheduleSave();
    updateWords();
    nextBtn.setAttribute('aria-label', qi === total - 1 ? 'Finish reflection' : ((ta.value || '').trim() ? 'Next question' : 'Skip to next question'));

  });

  reflectState = { entry };
  setupViewport();
  paint(false);
  const hasText = entry.answers.some(a => (a || '').trim());

  setTimeout(() => qText.focus({ preventScroll: true }), 50);
}

/* Keep the writing area and controls above the iPhone keyboard. */
let vvBound = false;
function setupViewport() {
  const update = () => {
    const vv = window.visualViewport;
    const hgt = vv ? vv.height : window.innerHeight;
    const top = vv ? vv.offsetTop : 0;
    document.documentElement.style.setProperty('--vv-h', hgt + 'px');
    document.documentElement.style.setProperty('--vv-top', top + 'px');
    document.body.classList.toggle('kb-open', !!vv && window.innerHeight - vv.height > 140);
  };
  update();
  if (!vvBound) {
    vvBound = true;
    if (window.visualViewport) { visualViewport.addEventListener('resize', update); visualViewport.addEventListener('scroll', update); }
    window.addEventListener('resize', update);
    window.addEventListener('orientationchange', () => setTimeout(update, 300));
  }
}

/* =====================================================================
   5. JOURNAL STATE  (unchanged from v1.0)
   ===================================================================== */
const storageState = { available: false, recoveredUnreadable: false };
let journal = { schema: JOURNAL_SCHEMA, app: 'moon-reflection', entries: {} };

function testStorage() {
  try { const k = 'sba.moonReflection.__test'; localStorage.setItem(k, '1'); const ok = localStorage.getItem(k) === '1'; localStorage.removeItem(k); return ok; }
  catch (e) { return false; }
}
function sanitizeEntry(raw) {
  if (!raw || typeof raw !== 'object' || typeof raw.id !== 'string' || !raw.id) return null;
  const str = (v, d = '') => (typeof v === 'string' ? v : d);
  const questions = Array.isArray(raw.questions) ? raw.questions.filter(q => typeof q === 'string').slice(0, 12) : [];
  if (!questions.length) return null;
  const answers = questions.map((_, i) => (Array.isArray(raw.answers) && typeof raw.answers[i] === 'string') ? raw.answers[i] : '');
  const validDate = v => (typeof v === 'string' && !isNaN(new Date(v).getTime())) ? v : null;
  const ip = raw.interpretation && typeof raw.interpretation === 'object' ? raw.interpretation : {};
  const now = new Date().toISOString();
  return {
    id: raw.id,
    eventId: str(raw.eventId, 'unknown-event'),
    eventType: raw.eventType === 'new' ? 'new' : 'full',
    eventDate: validDate(raw.eventDate) || validDate(raw.createdAt) || now,
    interpretation: { theme: str(ip.theme), release: str(ip.release), invitation: str(ip.invitation), system: str(ip.system), isDemo: ip.isDemo !== false },
    questions, answers,
    currentQ: Number.isInteger(raw.currentQ) ? Math.min(Math.max(raw.currentQ, 0), questions.length - 1) : 0,
    completed: raw.completed === true,
    createdAt: validDate(raw.createdAt) || now,
    updatedAt: validDate(raw.updatedAt) || validDate(raw.createdAt) || now
  };
}
function migrateJournal(data) {
  const out = { schema: JOURNAL_SCHEMA, app: 'moon-reflection', entries: {} };
  const src = data.entries || {};
  const list = Array.isArray(src) ? src : Object.values(src);
  for (const r of list) { const e = sanitizeEntry(r); if (e) out.entries[e.id] = e; }
  return out;
}
function loadJournal() {
  storageState.available = testStorage();
  if (!storageState.available) return;
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEYS.journal); } catch (e) { storageState.available = false; return; }
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object' || !data.entries) throw new Error('Unexpected format');
    journal = migrateJournal(data);
  } catch (err) {
    try { localStorage.setItem(STORAGE_KEYS.unreadablePrefix + Date.now(), raw); storageState.recoveredUnreadable = true; } catch (e) {}
    console.warn('Journal data could not be parsed; a copy was preserved.', err);
  }
}
function persistJournal() {
  if (!storageState.available) return false;
  try {
    const s = JSON.stringify(journal);
    localStorage.setItem(STORAGE_KEYS.journal, s);
    return localStorage.getItem(STORAGE_KEYS.journal) === s;
  } catch (e) { console.warn('Save failed', e); return false; }
}

const Journal = {
  all() { return Object.values(journal.entries).sort((a, b) => (b.eventDate.localeCompare(a.eventDate)) || b.updatedAt.localeCompare(a.updatedAt)); },
  get(id) { return journal.entries[id] || null; },
  forEvent(eventId) { return Object.values(journal.entries).filter(e => e.eventId === eventId).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt)); },
  answeredCount(e) { return e.answers.filter(a => (a || '').trim()).length; },
  create(ev) {
    const now = new Date().toISOString();
    const entry = {
      id: uid(), eventId: ev.id, eventType: ev.type, eventDate: ev.dateTime,
      interpretation: { theme: ev.theme, release: ev.release, invitation: ev.invitation, system: ev.interpretationSystem, isDemo: ev.isDemo },
      questions: ev.questions.slice(), answers: ev.questions.map(() => ''),
      currentQ: 0, completed: false, createdAt: now, updatedAt: now
    };
    journal.entries[entry.id] = entry;
    autosave.dirty = true;
    return entry;
  },
  remove(id) {
    const backup = journal.entries[id];
    delete journal.entries[id];
    if (persistJournal()) return true;
    journal.entries[id] = backup;
    return false;
  },
  isStoredAsShown(entry) {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEYS.journal) || '{}');
      const st = data.entries && data.entries[entry.id];
      return !!st && JSON.stringify(st.answers) === JSON.stringify(entry.answers);
    } catch (e) { return false; }
  }
};

function exportJournal() {

  const payload = { format: BACKUP_FORMAT, schema: JOURNAL_SCHEMA, app: CONFIG.APP_NAME, appVersion: CONFIG.VERSION, exportedAt: new Date().toISOString(), entryCount: entries.length, entries };
  const name = `moon-reflection-backup-${new Date().toISOString().slice(0, 10)}.json`;
  try {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: name, style: 'display:none' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast(`Backup created: ${entries.length} reflection${entries.length === 1 ? '' : 's'}. Check your Downloads or Files app.`, 4500);
  } catch (e) { toast('The backup file could not be created in this browser.', 4500); }
}
function pickImportFile() {

  input.addEventListener('change', () => { const f = input.files && input.files[0]; input.remove(); if (f) readImport(f); });
  document.body.append(input); input.click();
}
function readImport(file) {

  reader.onerror = () => showModal({ title: 'Import failed', body: 'The file could not be read.' });
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(String(reader.result)); } catch (e) { return showModal({ title: 'Not a valid backup', body: 'This file is not a Moon Reflection backup (it is not valid JSON). Nothing was changed.' }); }
    if (!data || data.format !== BACKUP_FORMAT || !Array.isArray(data.entries)) return showModal({ title: 'Not a valid backup', body: 'This file is not a compatible Moon Reflection backup. Nothing was changed.' });
    if (typeof data.schema === 'number' && data.schema > JOURNAL_SCHEMA) return showModal({ title: 'Backup from a newer version', body: 'This backup was created by a newer version of Moon Reflection and cannot be imported here. Nothing was changed.' });
    const incoming = data.entries.map(sanitizeEntry).filter(Boolean);
    const existing = Object.keys(journal.entries).length;
    const overlap = incoming.filter(e => journal.entries[e.id]).length;
    const choice = await showModal({
      title: 'Import backup',
      body: [`This backup contains ${incoming.length} reflection${incoming.length === 1 ? '' : 's'}${data.exportedAt ? ' (exported ' + fmtShort(new Date(data.exportedAt)) + ')' : ''}. You currently have ${existing} on this device.`,
        'Add to my journal: keeps everything you have and adds the backup’s reflections.' + (overlap ? ` ${overlap} reflection${overlap === 1 ? ' exists' : 's exist'} in both — for these, the more recently edited version is kept, which may replace your current text.` : ''),
        'Replace my journal: removes all reflections currently on this device and uses only the backup.'],
      actions: [{ label: 'Add to my journal', value: 'merge', style: 'primary' }, { label: 'Replace my journal', value: 'replace', style: 'danger' }, { label: 'Cancel', value: null }]
    });
    if (!choice) return;
    if (choice === 'replace' && existing > 0) {
      const sure = await showModal({ title: 'Replace all reflections?', body: [`All ${existing} reflection${existing === 1 ? '' : 's'} currently on this device will be replaced by the backup.`, 'A safety copy of your current journal is kept on this device before replacing.'],
        actions: [{ label: 'Yes, replace my journal', value: 'yes', style: 'danger' }, { label: 'Cancel', value: null }] });
      if (sure !== 'yes') return;
    }
    const before = JSON.stringify(journal);
    try { localStorage.setItem(STORAGE_KEYS.preImportBackup, before); } catch (e) {}
    if (choice === 'replace') { journal.entries = {}; incoming.forEach(e => { journal.entries[e.id] = e; }); }
    else incoming.forEach(e => { const cur = journal.entries[e.id]; if (!cur || e.updatedAt > cur.updatedAt) journal.entries[e.id] = e; });
    if (persistJournal()) { toast(`Import complete — ${Object.keys(journal.entries).length} reflections on this device.`, 4000); render(); }
    else { journal = JSON.parse(before); showModal({ title: 'Import not saved', body: 'Device storage did not accept the imported data, so your journal was left exactly as it was.' }); }
  };
  reader.readAsText(file);
}
async function deleteAllData() {
  const n = Object.keys(journal.entries).length;

    actions: [{ label: 'Export a backup first', value: 'export', style: 'primary' }, { label: 'Delete everything', value: 'delete', style: 'danger' }, { label: 'Cancel', value: null }] });

const SBA_WORLD = {
  url() { return (CONFIG.SBA_WEBSITE_URL || '').trim(); },
  isConfigured() { return /^https:\/\/[^\s/$.?#].[^\s]*$/i.test(this.url()); }
};
function openWorld() {
  if (SBA_WORLD.isConfigured()) {
    const a = h('a', { href: SBA_WORLD.url(), target: '_blank', rel: 'noopener noreferrer', style: 'display:none' });
    document.body.append(a); a.click(); a.remove();
    return;
  }
  showModal({ title: 'Coming Soon', body: ['The Soul Blueprint Astrology website is being prepared.', 'When it is live, this is where your reflection will continue into the wider SBA world.'], actions: [{ label: 'Close', value: null }] });
}
function openContact() {
  const u = (CONFIG.CONTACT_URL || '').trim();
  if (/^(mailto:|https:\/\/)/i.test(u)) { const a = h('a', { href: u, target: '_blank', rel: 'noopener noreferrer', style: 'display:none' }); document.body.append(a); a.click(); a.remove(); return; }
  showModal({ title: 'Coming Soon', body: 'Contact details for Soul Blueprint Astrology will be added here.', actions: [{ label: 'Close', value: null }] });
}

/* =====================================================================
   BOOT
   ===================================================================== */
function boot() {
  loadJournal();
  loadSettings();
  $('#menuBack').addEventListener('click', () => closeMenu());
  $('#menuClose').addEventListener('click', () => closeMenu());
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  document.querySelectorAll('#tabbar button').forEach(b => b.addEventListener('click', () => go(b.dataset.route)));
  render();
}
boot();
</script>
</body>
</html>
